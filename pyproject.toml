[project]
name = "narratarr"
version = "0.5.6"
description = "An *arr-style audiobook manager with a built-in player: discover, download, organize and listen."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["audiobooks", "librivox", "arr", "self-hosted", "audiobookshelf"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "rapidfuzz>=3.14.6",
    "mutagen>=1.48.1",
]

[project.urls]
Homepage = "https://github.com/narratarr/narratarr"
Issues = "https://github.com/narratarr/narratarr/issues"

[project.scripts]
narratarr = "narratarr.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["narratarr"]

[tool.hatch.build.targets.wheel.force-include]
"CHANGELOG.md" = "narratarr/CHANGELOG.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["real_auth: go through real accounts and sessions instead of the signed-in test admin"]
